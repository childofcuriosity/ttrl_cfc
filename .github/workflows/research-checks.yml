name: research checks

on:
  push:
  pull_request:

jobs:
  reward-ablation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pytest
      - run: python -m pytest tests/reward_score/test_ttrl_math_reward_modes.py -q
      - run: bash -n examples/ttrl/run_reward_ablation.sh
      - name: Check analysis script syntax
        run: |
          python -m py_compile \
            analysis/extract_training_metrics.py \
            analysis/summarize_covalidate.py \
            analysis/plot_ablation.py
